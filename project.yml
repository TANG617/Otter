name: Otter
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "18.0"
  groupSortPosition: top
  generateEmptyDirectories: true
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 7.11.1
targets:
  Otter:
    type: application
    platform: iOS
    sources:
      - path: Otter
    dependencies:
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_NAME: Otter
        PRODUCT_BUNDLE_IDENTIFIER: "$(OTTER_APP_BUNDLE_IDENTIFIER)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Otter
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Otter saves only the photos you explicitly download.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Otter connects to the Immich server you choose on your local network.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: Otter/Resources/Info.plist
      properties:
        CFBundleDisplayName: Otter
        UILaunchScreen: {}
        NSPhotoLibraryAddUsageDescription: Otter saves only the photos you explicitly download.
        NSLocalNetworkUsageDescription: Otter connects to the Immich server you choose on your local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  OtterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OtterTests
    dependencies:
      - target: Otter
    settings:
      base:
        PRODUCT_NAME: OtterTests
        PRODUCT_BUNDLE_IDENTIFIER: "$(OTTER_APP_BUNDLE_IDENTIFIER).tests"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Otter.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Otter"
        BUNDLE_LOADER: "$(TEST_HOST)"
  OtterUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: OtterUITests
    dependencies:
      - target: Otter
    settings:
      base:
        PRODUCT_NAME: OtterUITests
        PRODUCT_BUNDLE_IDENTIFIER: "$(OTTER_APP_BUNDLE_IDENTIFIER).uitests"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Otter
schemes:
  Otter:
    build:
      targets:
        Otter: all
        OtterTests: [test]
        OtterUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: OtterTests
          parallelizable: true
        - name: OtterUITests
          parallelizable: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
